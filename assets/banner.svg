<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    /* CSS Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes particleFlowLeft {
      0% { cx: 200px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 1000px; opacity: 0; }
    }
    @keyframes particleFlowRight {
      0% { cx: 1000px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 200px; opacity: 0; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .bg-grid { fill: url(#gridPattern); }
    .orb-cyan { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 220px 210px; }
    .orb-purple { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 980px 210px; }
    .flow-line { stroke-dasharray: 8 6; animation: waveDash 4s linear infinite; }
    .flow-line-rev { stroke-dasharray: 8 6; animation: waveDash 4s linear infinite reverse; }
    
    .sync-particle-1 { animation: particleFlowLeft 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .sync-particle-2 { animation: particleFlowLeft 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.6s; }
    .sync-particle-rev-1 { animation: particleFlowRight 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.8s; }
    .sync-particle-rev-2 { animation: particleFlowRight 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 2.4s; }

    .pill-item { animation: floatPill 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" class="bg-grid" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Ambient Glowing Orbs -->
  <g opacity="0.6">
    <circle cx="200" cy="210" r="130" fill="#06b6d4" filter="url(#glowCyan)" class="orb-cyan" opacity="0.25" />
    <circle cx="1000" cy="210" r="140" fill="#a855f7" filter="url(#glowPurple)" class="orb-purple" opacity="0.25" />
    <circle cx="600" cy="380" r="180" fill="#3b82f6" filter="url(#glowCyan)" opacity="0.1" />
  </g>

  <!-- DYNAMIC BACKGROUND FLOW: Data Sync Tracks connecting Systems -->
  <g opacity="0.75">
    <!-- Top Sync Pipeline: Warehouse to Operational Apps -->
    <path d="M 220 310 C 450 280, 750 280, 980 310" fill="none" stroke="#0ea5e9" stroke-width="2.5" class="flow-line" opacity="0.6" />
    <!-- Bottom Sync Pipeline: Operational Apps back to Warehouse / CDC -->
    <path d="M 980 335 C 750 365, 450 365, 220 335" fill="none" stroke="#d946ef" stroke-width="2.5" class="flow-line-rev" opacity="0.6" />
    
    <!-- Dynamic Moving Synchronization Particles -->
    <circle cy="295" r="5" fill="#38bdf8" filter="url(#glowCyan)" class="sync-particle-1" />
    <circle cy="295" r="4" fill="#a5f3fc" class="sync-particle-2" />
    
    <circle cy="350" r="5" fill="#f472b6" filter="url(#glowPurple)" class="sync-particle-rev-1" />
    <circle cy="350" r="4" fill="#fbcfe8" class="sync-particle-rev-2" />
  </g>

  <!-- Outer Endpoint Nodes (Source & Destination) -->
  <g transform="translate(140, 280)">
    <rect x="0" y="0" width="130" height="70" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="65" y="32" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">DATA WAREHOUSE</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Snowflake / BigQuery</text>
  </g>

  <g transform="translate(930, 280)">
    <rect x="0" y="0" width="130" height="70" rx="12" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
    <text x="65" y="32" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">BUSINESS APPS</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CRM / ERP / SaaS</text>
  </g>

  <!-- Center Bi-directional Sync Hub Indicator -->
  <g transform="translate(565, 305)">
    <circle cx="35" cy="18" r="28" fill="#1e1b4b" stroke="url(#cyanBlueGrad)" stroke-width="2.5" />
    <path d="M 23 14 L 47 14 M 41 8 L 47 14 L 41 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 47 24 L 23 24 M 29 18 L 23 24 L 29 30" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND: Content Elements (Guaranteed Unobscured) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(450, 48)">
      <rect x="0" y="0" width="300" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="156" y="20" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED DATA ACTIVATION STACK</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
      Awesome Bidirectional Data Sync
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="400" font-size="18">
      Top Reverse ETL, iPaaS, Real-Time CDC &amp; Continuous Warehouse-to-App Synchronization
    </text>

    <!-- Gradient Divider -->
    <rect x="420" y="188" width="360" height="2" fill="url(#accentLine)" rx="1" />

    <!-- Feature Badges / Pills in foreground -->
    <g transform="translate(230, 206)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" />
        <text x="82" y="22" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">⚡ Real-Time Reverse ETL</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="90" y="22" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🔄 2-Way CRM Integration</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
        <text x="87" y="22" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌐 Enterprise iPaaS Hub</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(580, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
        <text x="80" y="22" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌟 Top Open-Source Tools</text>
      </g>
    </g>
  </g>
</svg>
